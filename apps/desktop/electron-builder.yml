electronVersion: 41.5.2
appId: com.rapidprompt.workbench
productName: Rapid Prompt Workbench

directories:
  output: release
  buildResources: buildResources

files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  - "!**/*.map"

asar: true
asarUnpack:
  - "**/*.node"
npmRebuild: true

mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - dmg

dmg:
  artifactName: Rapid-Prompt-Workbench-${version}-${arch}.${ext}

extraResources:
  - from: llm.config.json
    to: llm.config.json
